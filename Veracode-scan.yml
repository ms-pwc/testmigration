pool:
  vmImage: ubuntu-latest
 
schedules:
- cron: "36 9 * * *"
  displayName: Daily 15:06 IST test build
  branches:
    include:
    - main 
  always: true
parameters:
- name: GITREPO
  type: object
  default:
  - Search-API
- name: BRANCH_NAME
  type: string
  default: main
  displayName: 'Branch to scan'
 
resources:
  repositories:
  - repository: Search-API
    type: git
    name: testmigration/Search-API
    ref: refs/heads/${{ parameters.BRANCH_NAME }}
jobs: 
- job: stepList
  workspace:
    clean: all
  steps:
  - ${{ each REPO in parameters.GITREPO }}:
    - checkout: ${{ REPO }}
      path: 's/${{ REPO }}'
 
    - task: UsePythonVersion@0
      displayName: 'Use Python '
      inputs:
        versionSpec: '3.11'
        addToPath: true
        architecture: 'x64'
      name: pyTools
      enabled: true
    - script: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev
      displayName: 'Install build dependencies'
    - script: python -m pip install --upgrade pip setuptools wheel flake8 pipenv
      displayName: 'PIP Install tools'
 
    - script: |
        export PIPENV_PYTHON=$(which python)
        pipenv install -r  $(Pipeline.Workspace)/s/${{ REPO }}/requirements.txt 
      displayName: 'Install Python Requirements'
    - script: |
        pipenv lock
      displayName: piplock
    - task: CopyFiles@2
      displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
      inputs:
        SourceFolder: '$(System.DefaultWorkingDirectory)'
        Contents: |
          **/*.py
          **/*.htm
          **/*.html
          **/*.lock
        TargetFolder: $(Build.ArtifactStagingDirectory)
        CleanTargetFolder: true
    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true
  # - task: Veracode@3
  #   inputs:
  #     ConnectionDetailsSelection: 'Endpoint'
  #     AnalysisService: 'veracode-connection'
  #     veracodeAppProfile: 'USA-ADV-Concourse-Search'
  #     version: '$(Build.BuildId)'
  #     filepath: '$(build.artifactstagingdirectory)'
  #     sandboxName: 'Python Dailyscan'
  #     createSandBox: true
  #     importResults: true
  #     failBuildOnPolicyFail: false
  #     maximumWaitTime: '360'
  - script: |
      echo "Intentional failure for test validation"
      exit 1
    displayName: 'Intentional failure for work item validation'
  - task: CreateWorkItem@2
    inputs:
      teamProject: 'testmigration'
      workItemType: 'Issue'
      title: 'ConcourseSearch Veracode Backend Scan Pipeline Failing'
      assignedTo: '$(Build.RequestedForId)'
      areaPath: 'testmigration'
      iterationPath: 'testmigration@currentIteration'
      fieldMappings: |
        Severity=3 - Medium
        Repro Steps=This work item was automatically created because Veracode Backend Scan pipeline failing
        Tags=Build $(Build.BuildNumber)
    condition: failed()